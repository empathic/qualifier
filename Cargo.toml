[package]
name = "qualifier"
version = "0.6.1"
edition = "2024"
description = "Deterministic quality annotations for software artifacts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/empathic/qualifier"
readme = "README.md"
keywords = ["quality", "annotation", "code-review", "ci"]
categories = ["command-line-utilities", "development-tools"]

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:comfy-table", "dep:figment", "dep:gix", "dep:rand"]

[dependencies]
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
petgraph = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# CLI-only dependencies
clap = { version = "4", features = ["derive"], optional = true }
comfy-table = { version = "7", optional = true }
figment = { version = "0.10", features = ["toml", "env"], optional = true }
# gix powers `qualifier diff` (no fork/exec per .qual file at <ref>).
gix = { version = "0.83", optional = true }
rand = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "qualifier"
path = "src/bin/qualifier.rs"
required-features = ["cli"]

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
